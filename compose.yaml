services:
  gitea:
    image: docker.gitea.com/gitea:1.27.3
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__OFFLINE_MODE: "true"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vikunja
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: ${QA_PASSWORD:?start using run.sh}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vikunja", "-d", "vikunja"]
      interval: 2s
      timeout: 3s
      retries: 45
  vikunja:
    image: vikunja/vikunja:0.24.6
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://vikunja:3456/
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${QA_PASSWORD:?start using run.sh}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_MAILER_ENABLED: "false"
  grist:
    image: gristlabs/grist:1.7.20
    environment:
      GRIST_IN_SERVICE: "true"
      GRIST_ADMIN_EMAIL: qa@example.test
      GRIST_SINGLE_ORG: docs
      GRIST_DEFAULT_EMAIL: qa@example.test
      GRIST_FORCE_LOGIN: "true"
      APP_HOME_URL: http://grist:8484
      GRIST_WIDGET_LIST_URL: ""
  broker:
    image: redis:7-alpine
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
    depends_on:
      - broker
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_ADMIN_USER: qaoperator
      PAPERLESS_ADMIN_PASSWORD: ${QA_PASSWORD:?start using run.sh}
      PAPERLESS_SECRET_KEY: ${QA_PASSWORD:?start using run.sh}
      PAPERLESS_AUTO_LOGIN_USERNAME: qaoperator
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
  snipe-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: assets
      MARIADB_USER: assets
      MARIADB_PASSWORD: ${QA_PASSWORD:?start using run.sh}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 60
  snipe:
    image: snipe/snipe-it:v8.3.6
    depends_on:
      snipe-db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://snipe
      APP_KEY: ${SNIPE_APP_KEY:?start using run.sh}
      DB_CONNECTION: mysql
      DB_HOST: snipe-db
      DB_DATABASE: assets
      DB_USERNAME: assets
      DB_PASSWORD: ${QA_PASSWORD:?start using run.sh}
      MAIL_MAILER: log
      APP_TIMEZONE: UTC
      APP_LOCALE: en-US
  tests:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /tmp
    init: true
    environment:
      QA_PASSWORD: ${QA_PASSWORD:-}
    volumes:
      - ./package.json:/source/package.json:ro
      - ./package-lock.json:/source/package-lock.json:ro
      - ./playwright.config.ts:/source/playwright.config.ts:ro
      - ./tests:/source/tests:ro
      - ${REPORT_DIR:-./reports}:/output
    command:
      - bash
      - -ec
      - |
        mkdir -p /tmp/suite
        cp -r /source/package.json /source/package-lock.json /source/tests /source/playwright.config.ts /tmp/suite/
        cd /tmp/suite
        npm ci --ignore-scripts --no-audit --no-fund
        npx playwright test
